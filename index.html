<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>C0D3P@TH3R$ M3NU</title>
<style>
body {
    margin: 0;
    background: #000;
    font-family: "Courier New", monospace;
    color: #00ff88;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
}

h1 {
    font-size: 48px;
    text-shadow: 0 0 20px #00ff88;
    letter-spacing: 5px;
}

p {
    opacity: 0.7;
    margin-bottom: 20px;
}

button {
    margin: 10px;
    padding: 12px 24px;
    background: transparent;
    color: #00ff88;
    border: 2px solid #00ff88;
    cursor: pointer;
    font-size: 18px;
    transition: 0.2s;
    box-shadow: 0 0 15px rgba(0,255,136,0.3);
}

button:hover {
    background: #00ff88;
    color: #000;
    transform: scale(1.05);
}

/* secret mode: only revealed once unlocked on hard mode */
#hardcoreBtn {
    display: none;
    color: #ff3c3c;
    border-color: #ff3c3c;
    text-shadow: 0 0 10px #ff3c3c;
    box-shadow: 0 0 15px rgba(255,60,60,0.35);
}

#hardcoreBtn:hover {
    background: #ff3c3c;
    color: #000;
    text-shadow: none;
    box-shadow: 0 0 25px #ff3c3c;
}
</style>
</head>

<body>

<h1>C0D3P@TH3R$</h1>
<p>SELECT DIFFICULTY</p>

<button id="easyBtn" onclick="start('easy')">EASY</button>
<button id="mediumBtn" onclick="start('medium')">MEDIUM</button>
<button id="hardBtn" onclick="start('hard')">HARD</button>
<button id="hardcoreBtn" onclick="start('hardcore')">HARDCORE</button>

<script>
function start(mode){
    localStorage.setItem("mode", mode);
    window.location.href = "game.html";
}

function updateHighScores() {
    document.getElementById("easyBtn").textContent =
        `EASY — Highest level: ${localStorage.getItem("highscore_easy") || 0}`;
    document.getElementById("mediumBtn").textContent =
        `MEDIUM — Highest level: ${localStorage.getItem("highscore_medium") || 0}`;
    document.getElementById("hardBtn").textContent =
    `HARD — Highest level: ${localStorage.getItem("highscore_hard") || 0}`;

    // secret hardcore mode stays hidden until it is unlocked on hard mode
    const hardcoreBtn = document.getElementById("hardcoreBtn");

    if (localStorage.getItem("hardcore_unlocked") === "1") {
        hardcoreBtn.style.display = "inline-block";
        hardcoreBtn.textContent =
            `HARDCORE — Highest level: ${localStorage.getItem("highscore_hardcore") || 0}`;
    } else {
        hardcoreBtn.style.display = "none";
    }
}
updateHighScores();

</script>

</body>
</html>
