<head>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: "Courier New", monospace;
    }

    body{
        background:#020403;
        color:#00ff88;
        overflow:hidden;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    #gameContainer{
        width:95vw;
        max-width:900px;
        border:2px solid #00ff88;
        box-shadow:
            0 0 10px #00ff88,
            0 0 30px rgba(0,255,136,0.4),
            inset 0 0 20px rgba(0,255,136,0.15);
        background:#05110c;
        padding:18px;
        border-radius:12px;
    }

    h1{
        text-align:center;
        margin-bottom:10px;
        color:#8cffd2;
        text-shadow:0 0 8px #00ff88;
        letter-spacing:3px;
    }

    #topBar{
        display:flex;
        justify-content:space-between;
        margin-bottom:12px;
        gap:10px;
        flex-wrap:wrap;
    }

    .panel{
        flex:1;
        min-width:180px;
        border:1px solid #00ff88;
        padding:10px;
        border-radius:8px;
        background:rgba(0,255,136,0.05);
        box-shadow:0 0 10px rgba(0,255,136,0.15);
    }

    .label{
        color:#8cffd2;
        margin-bottom:5px;
    }

    #queue{
        min-height:40px;
        word-wrap:break-word;
        font-size:18px;
        line-height:1.4;
    }

    canvas {
    width: 100%;
    background: #000;
    border: 2px solid #00ff88;
    image-rendering: pixelated;
    border-radius: 8px;
    box-shadow:
        0 0 20px rgba(0,255,136,0.4),
        inset 0 0 20px rgba(0,255,136,0.15);
    } 

    #message{
        margin-top:14px;
        min-height:36px;
        text-align:center;
        font-size:22px;
        color:#ffffff;
        text-shadow:0 0 10px #ffffff;

    }

    #controls{
        margin-top:10px;
        text-align:center;
        color:#7cffc4;
        font-size:14px;

    }

    .danger{
        color:#ff3c3c;
        text-shadow:0 0 8px red;
    }

    .success{
        color:#ffffff;
        text-shadow:0 0 12px #ffffff;
    }
#gameContainer {
    transform: scale(0.6);
    transform-origin: center;
}

    /* ===== TIMER BAR SYSTEM ===== */

#timerBarContainer {
    width: 100%;
    height: 18px;
    border: 1px solid #00ff88;
    background: rgba(0, 0, 0, 0.6);
    box-shadow: inset 0 0 10px rgba(0, 255, 136, 0.2);
    border-radius: 6px;
    overflow: hidden;
}

#timerBar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #00ff88, #ffffff);
    box-shadow: 0 0 12px #00ff88;
    transition: width 0.2s linear;
}

#goButton {
    margin-top: 10px;
    padding: 10px 20px;
    background: #00ff88;
    border: none;
    color: black;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 10px #00ff88;
}

#goButton:hover {
    transform: scale(1.05);
}

</style>
</head>

<body>

<div id="gameContainer">
    <h1>C0D3P@TH3R$</h1>

    <div id="topBar">
        <div class="panel">
            <div class="label">LEVEL</div>
            <div id="levelText">1</div>
            <div id="controls">
        Arrow Keys = Queue Movement Commands<br>
        Backspace = Undo Last Command<br>
        Reach the glowing white portal without seeing movement during input.
        Clicking GO button = Start Execution Early (if you think you have it right)<br>
        Good luck!
    </div>
    <div class:"panel">
    <div class="label">TIME REMAINING</div>
    <div id="timerBarContainer">
        <div id="timerBar"></div>
    </div>
    <button id="goButton">GO</button>
</div>
    }
        </div>

        <div class="panel">
            <div class="label">TIMER</div>
            <div id="timerText">30</div>
        </div>

        <div class="panel">
            <div class="label">MODE</div>
            <div id="modeText">INPUT PHASE</div>
        </div>
    </div>

    <div class="panel" style="margin-bottom:12px;">
        <div class="label">QUEUE</div>
        <div id="queue"></div>
    </div>

    <canvas id="gameCanvas" width="640" height="640"></canvas>

    <div id="message"></div>

</div>
<script src="pathfinder.js"></script>
<script src="highscore.js"></script>
<script>
let playback = null; 
let mode = localStorage.getItem("mode") || "medium";
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const timerText = document.getElementById("timerText");
const timerBar = document.getElementById("timerBar");
const queueText = document.getElementById("queue");
const modeText = document.getElementById("modeText");
const levelText = document.getElementById("levelText");
const messageText = document.getElementById("message");

const MAX_LEVEL_SIZE = 15;
const START_SIZE = 8;

let level = 1;
let gridSize = START_SIZE;
let grid = [];

let maze = [];
let queue = [];

let inputPhase = true;
let executing = false;

let timer = 30;
let timerInterval;

let player = {x:0,y:0};
let executionPlayer = {x:0,y:0};

const symbols = {
    ArrowUp: "▲",
    ArrowDown: "▼",
    ArrowLeft: "◀",
    ArrowRight: "▶"
};

if (mode === "easy") {
    gridSize = 4;
    timer = 40;
}

if (mode === "medium") {
    gridSize = 8;
    timer = 30;
}

if (mode === "hard") {
    gridSize = 12;
    timer = 20;
}

function startLevel(){
    queue = [];
    inputPhase = true;
    executing = false;

    player = {x:0,y:0};
    executionPlayer = {x:0,y:0};

    timer = 30;

    levelText.textContent = level;
    modeText.textContent = "INPUT PHASE";
    messageText.textContent = "";
    do {
    generateMaze();
} while (!isSolvable(grid, gridSize));
    updateQueueDisplay();
    startTimer();
    draw();
}

function startTimer(){
   timerInterval = setInterval(()=>{
    timer--;
    timerText.textContent = timer;

    let percent = (timer / 30) * 100;
    timerBar.style.width = percent + "%";

    if(timer <= 0){
        clearInterval(timerInterval);
        beginExecution();
    }
},1000);
}

function updateQueueDisplay(){
    queueText.textContent = queue.map(q => symbols[q]).join(" ");
}

function beginExecution(){
    inputPhase = false;
    executing = true;

    modeText.textContent = "EXECUTION MODE";
    let index = 0;

    playback = setInterval(()=>{

        if(index >= queue.length){
            clearInterval(playback);

            if(
                executionPlayer.x === gridSize - 1 &&
                executionPlayer.y === gridSize - 1
            ){
                levelComplete();
            }else{

                clearInterval(playback);
                gameOver("SYSTEM CRASH");
                return;

            }

            return;
        }

        const move = queue[index];

        let nx = executionPlayer.x;
        let ny = executionPlayer.y;

        if(move === "ArrowUp") ny--;
        if(move === "ArrowDown") ny++;
        if(move === "ArrowLeft") nx--;
        if(move === "ArrowRight") nx++;

        // Boundary crash
        if(nx < 0 || ny < 0 || nx >= gridSize || ny >= gridSize){
            clearInterval(playback);
            draw();
            gameOver("SYSTEM CRASH: GAME OVER");
            return;
        }

        // Wall crash
        if(grid[ny][nx] === 1){
            clearInterval(playback);
            executionPlayer.x = nx;
            executionPlayer.y = ny;
            draw();
            gameOver("SYSTEM CRASH: GAME OVER");
            return;
        }

        executionPlayer.x = nx;
        executionPlayer.y = ny;

        draw();

        index++;

    },200);
}

function levelComplete(){
    messageText.textContent = "ACCESS GRANTED — LEVEL CLEARED";
    messageText.className = "success";

    pulseBorder();

    setTimeout(()=>{
        level++;
        if(gridSize < MAX_LEVEL_SIZE){
            gridSize++;
        }
        
        startLevel();
    },2000);
}

function gameOver(msg){
    inputPhase = false;
    executing = false;

    clearInterval(timerInterval);
    if (playback) {
    clearInterval(playback);
    playback = null;
}

 saveHighScore(mode, level);

    messageText.textContent = msg;
    messageText.className = "danger";

    redPulse(); 

    setTimeout(() => {
    window.location.href = "./index.html";
}, 900);
}

function draw(){
    if (!grid || !grid.length) return;
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    const tileSize = canvas.width / gridSize;

    // Background glow
    

    for(let y=0;y<gridSize;y++){
        for(let x=0;x<gridSize;x++){

            const px = x * tileSize;
            const py = y * tileSize;

            // Tile border
            ctx.strokeStyle = "rgba(0,255,136,0.15)";
            ctx.strokeRect(px, py, tileSize, tileSize);

            if(grid[y][x] === 1){

                ctx.fillStyle = "#00aa55";
                ctx.shadowColor = "#00ff88";
                ctx.shadowBlur = 10;

                ctx.fillRect(
                    px + 4,
                    py + 4,
                    tileSize - 8,
                    tileSize - 8
                );
            }
        }
    }

    // Exit portal
    const ex = (gridSize - 1) * tileSize;
    const ey = (gridSize - 1) * tileSize;

    ctx.beginPath();
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 20;

    ctx.arc(
        ex + tileSize/2,
        ey + tileSize/2,
        tileSize/4,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Player rendering
    const renderPlayer = executing ? executionPlayer : player;

    ctx.beginPath();

    ctx.fillStyle = "#00ff88";
    ctx.shadowColor = "#00ff88";
    ctx.shadowBlur = 20;

    ctx.arc(
        renderPlayer.x * tileSize + tileSize/2,
        renderPlayer.y * tileSize + tileSize/2,
        tileSize/4,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur = 0;
}

window.addEventListener("keydown",(e)=>{

    if(inputPhase){

        if([
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight"
        ].includes(e.key)){

            queue.push(e.key);
            updateQueueDisplay();
            e.preventDefault();
        }

        if(e.key === "Backspace"){
            queue.pop();
            updateQueueDisplay();
            e.preventDefault();
        }
        if (e.key === "Enter" && inputPhase) {
            e.preventDefault();
            clearInterval(timerInterval);
            beginExecution();
            }
    }
});

function pulseBorder() {
    let i = 0;

    const colors = [
        "#00ff88",
        "#ffffff",
        "#00ff88",
        "#ffffff",
        "#00ff88",
        "#ffffff"
    ];

    const interval = setInterval(() => {
        canvas.style.borderColor = colors[i];
        canvas.style.boxShadow = `0 0 100px ${colors[i]}`;

        i++;

        if (i >= colors.length) {
            clearInterval(interval);
            canvas.style.borderColor = "#00ff88";
            canvas.style.boxShadow = "0 0 50px rgba(0,255,136,0.4)";
        }
    }, 120);
}

function redPulse() {
    canvas.style.transition = "box-shadow 1s ease";

    // big crash flash
    canvas.style.boxShadow = "0 0 250px #ff0000";

    // return to normal glow
    setTimeout(() => {
        canvas.style.transition = "box-shadow 1s ease";
        canvas.style.boxShadow = "0 0 20px rgba(0,255,136,0.4)";
    }, 300);
}

document.getElementById("goButton").addEventListener("click", () => {
    if (inputPhase) {
        clearInterval(timerInterval);
        beginExecution();
    }
});
startLevel();
</script>

</body>
</html>
